name: Bug Report
description: Report a bug in Codex Profile Switcher
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: "From Settings > General, or `codex-profile --version`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: "Optional: paste output from Settings > General > Copy Debug Info"
      render: text
