name: CI

on:
  push:
    branches: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Tests
        run: make test

      - name: Build
        run: make build BUILD_OUT=/tmp/codex-profile-switcher-build-check

      - name: Version check
        run: |
          set -euo pipefail
          source version.env
          swift_ver=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' CodexProfileSwitcher.swift | head -1)
          if [[ "$swift_ver" != "$MARKETING_VERSION" ]]; then
            echo "ERROR: version.env ($MARKETING_VERSION) != CodexProfileSwitcher.swift ($swift_ver)"
            exit 1
          fi
